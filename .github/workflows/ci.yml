# OPS-030: lint, types, tests, coverage gate, secret scan, dependency audit,
# frontend build — on every push and PR.
# OPS-033: `make test-live` MUST NOT run here (it places real paper orders).
# OPS-034: deployment is manual (workflow_dispatch / tag), never automatic.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Types
        run: mypy underwriter
      - name: Tests
        run: pytest --cov=underwriter --cov-report=term-missing --cov-report=xml
      # OPS-031: the build MUST fail if Kernel coverage < 100% or Actuary < 95%.
      # Enabled once those modules exist — an absent module must not pass silently.
      - name: Coverage gate — kernel 100%, actuary 95%
        run: |
          if [ -d underwriter/kernel ]; then
            coverage report --include="underwriter/kernel/*" --fail-under=100
          fi
          if [ -d underwriter/actuary ]; then
            coverage report --include="underwriter/actuary/*" --fail-under=95
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm run build
      # UI-011: bundle <= 400KB gzipped.
      - name: Bundle budget
        run: |
          total=$(find dist/assets -name '*.js' -o -name '*.css' \
            | xargs -r gzip -c | wc -c)
          echo "gzipped bundle: ${total} bytes (budget 409600)"
          test "$total" -le 409600

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # OPS-032: build MUST fail on any secret-scanner finding.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # OPS-032: and on any HIGH/CRITICAL dependency advisory.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --strict
